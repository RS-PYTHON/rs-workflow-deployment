apiVersion: v1
kind: ConfigMap
metadata:
  name: prefect-automation-config-{{ app_name }}
data:
  automation.json: |
    {
      "name": "S3 L2 OLCI quicklook on quicklook-inputs-ready",
      "description": "Generate and register quicklooks for published S3 L2 OLCI products.",
      "enabled": true,
      "trigger": {
        "type": "event",
        "match": {
          "prefect.resource.id": [
            "rs-python.s3-l2-result.*"
          ]
        },
        "match_related": {},
        "after": [],
        "expect": [
          "rs-python.s3-l2.quicklook-inputs-ready"
        ],
        "for_each": [],
        "posture": "Reactive",
        "threshold": 1,
        "within": 0
      },
      "actions": [
        {
          "type": "run-deployment",
          "source": "selected",
          "deployment_id": "__S3_L2_QUICKLOOK_DEPLOYMENT_ID__",
          "parameters": {
            "owner_id": {
              "__prefect_kind": "jinja",
              "template": "{% raw %}{{ event.payload.owner_id }}{% endraw %}"
            },
            "published_items": {
              "__prefect_kind": "json",
              "value": {
                "__prefect_kind": "jinja",
                "template": "{% raw %}{{ event.payload.published_items | tojson }}{% endraw %}"
              }
            }
          }
        }
      ]
    }
