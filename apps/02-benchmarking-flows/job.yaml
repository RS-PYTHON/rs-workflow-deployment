apiVersion: batch/v1
kind: Job
metadata:
  name: prefect-deployment-job-{{ app_name }}
spec:
  template:
    spec:
      containers:
      - name: prefect-deployment-job
        # Image of the flow runs, tagged with the rs-client-libraries version that the deployments pull (see
        # deploy_flows.py)
        image: ghcr.io/rs-python/prefect/rs-client-libraries/k8s:v1.0a16
        command:
          - python
          - -c
          # Script shared by all the flow deployment jobs, included at deployment time. NOTE: keep the empty line
          # after the include, that Ansible removes (trim_blocks): the next line would be appended to the script.
          - |
            {% filter indent(12) %}{% include 'deploy_flows.py' %}{% endfilter %}

        env:
        - name: PREFECT_API_URL
          value: "http://prefect-copernicus-server.processing.svc.cluster.local:4200/api"
        volumeMounts:
        - name: deployment-script
          mountPath: /opt/prefect/prefect.yaml
          subPath: prefect.yaml
      volumes:
      - name: deployment-script
        configMap:
          name: prefect-flow-deploy-config-{{ app_name }}
      restartPolicy: Never
