apiVersion: v1
kind: ConfigMap
metadata:
  name: prefect-automation-config-{{ app_name }}
data:
  automation.json: |
    {
      "name": "S03OLCEFR generated -> S3 L2 OLCI",
      "description": "Starts the systematic S3 L2 OLCI processing of each S03OLCEFR product generated by a systematic processing (workflow related resource).",
      "enabled": true,
      "tags": [],
      "trigger": {
        "type": "event",
        "match": {
          "prefect.resource.id": [
            "prefect.flow-run.*"
          ]
        },
        "match_related": {
          "prefect.resource.role": "workflow",
          "prefect.resource.id": "systematic"
        },
        "after": [],
        "expect": [
          "product.S03OLCEFR.generated"
        ],
        "for_each": [],
        "posture": "Reactive",
        "threshold": 1,
        "within": 0.0
      },
      "actions": [
        {
          "type": "run-deployment",
          "source": "selected",
          "deployment_id": "__S3_L2_DEPLOYMENT_ID__",
          "parameters": {
            "payload": {
              "value": {
                "template": "{% raw %}{{ event.payload | tojson }}{% endraw %}",
                "__prefect_kind": "jinja"
              },
              "__prefect_kind": "json"
            }
          },
          "job_variables": {},
          "schedule_after": 0.0
        }
      ],
      "actions_on_trigger": [],
      "actions_on_resolve": [],
      "owner_resource": null
    }
