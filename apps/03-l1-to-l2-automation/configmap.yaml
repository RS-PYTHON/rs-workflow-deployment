apiVersion: v1
kind: ConfigMap
metadata:
  name: prefect-automation-config-{{ app_name }}
data:
  automation.json: |
    {
      "name": "S3 L1 products ready -> S3 L2 OLCI",
      "description": "",
      "enabled": true,
      "tags": [],
      "trigger": {
        "type": "event",
        "match": {
          "prefect.resource.id": [
            "rs-python.s3-l1-result.*"
          ]
        },
        "match_related": {},
        "after": [],
        "expect": [
          "rs-python.s3-l1.products-ready"
        ],
        "for_each": [],
        "posture": "Reactive",
        "threshold": 1,
        "within": 0.0
      },
      "actions": [
        {
          "type": "run-deployment",
          "source": "selected",
          "deployment_id": "__S3_L2_DEPLOYMENT_ID__",
          "parameters": {
            "input_products": {
              "value": {
                "template": "{% raw %}{{ event.payload[\"input_products\"] | tojson }}{% endraw %}",
                "__prefect_kind": "jinja"
              },
              "__prefect_kind": "json"
            }
          },
          "job_variables": {},
          "schedule_after": 0.0
        }
      ],
      "actions_on_trigger": [],
      "actions_on_resolve": [],
      "owner_resource": null
    }
