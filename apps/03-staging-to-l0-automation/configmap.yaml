apiVersion: v1
kind: ConfigMap
metadata:
  name: prefect-automation-config-{{ app_name }}
data:
  automation.json: |
    {
      "name": "CADIP staging completed -> S3 L0",
      "description": "Starts S3 L0 after the CADIP staging deployment completes successfully.",
      "enabled": true,
      "tags": [],
      "trigger": {
        "type": "event",
        "match": {
          "prefect.resource.id": [
            "prefect.flow-run.*"
          ]
        },
        "match_related": {
          "prefect.resource.id": [
            "prefect.deployment.__STAGING_DEPLOYMENT_ID__"
          ]
        },
        "after": [],
        "expect": [
          "prefect.flow-run.Completed"
        ],
        "for_each": [],
        "posture": "Reactive",
        "threshold": 1,
        "within": 0.0
      },
      "actions": [
        {
          "type": "run-deployment",
          "source": "selected",
          "deployment_id": "__S3_L0_DEPLOYMENT_ID__",
          "parameters": {
            "session": {
              "template": "{% raw %}{{ flow_run.parameters.session_identifier }}{% endraw %}",
              "__prefect_kind": "jinja"
            }
          },
          "job_variables": {},
          "schedule_after": 0.0
        }
      ],
      "actions_on_trigger": [],
      "actions_on_resolve": [],
      "owner_resource": null,
      "id": "b07e7173-24a8-45ee-bc51-582bc7a8e2cd"
    }
