apiVersion: batch/v1
kind: Job
metadata:
  name: prefect-automations-job-{{ app_name }}
spec:
  template:
    spec:
      containers:
      - name: prefect-automations-job
        image: prefecthq/prefect:3.9.1-python3.13-kubernetes
        # The script and the automation JSON files are in the scripts and automations directories of this
        # application, see the configMapGenerator of kustomization.yaml
        command:
        - bash
        - /opt/prefect/scripts/create-automations.sh
        env:
        - name: PREFECT_API_URL
          value: "http://prefect-copernicus-server.processing.svc.cluster.local:4200/api"
        - name: AUTOMATIONS_DIR
          value: /opt/prefect/automations
        volumeMounts:
        - name: automations
          mountPath: /opt/prefect/automations
        - name: scripts
          mountPath: /opt/prefect/scripts
      volumes:
      - name: automations
        configMap:
          name: prefect-automations-config-{{ app_name }}
      - name: scripts
        configMap:
          name: prefect-automations-scripts-{{ app_name }}
      restartPolicy: Never
