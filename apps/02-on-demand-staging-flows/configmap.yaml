apiVersion: v1
kind: ConfigMap
metadata:
  name: prefect-flow-deploy-config-{{ app_name }}
data:
  prefect.yaml: |
    prefect-version: "3"

    pull:
    - prefect.deployments.steps.git_clone:
        repository: https://github.com/RS-PYTHON/rs-client-libraries.git
        branch: v1.0a11 # v1.0a11

    definitions:
      work_pools:
        my_work_pool: &my_work_pool
          name: {{ prefect3worker.integrated.name }}

    deployments:
    - name: Stage Aux
      tags: ["aux", "staging"]
      entrypoint: ./rs_workflows/aux_flow.py:on_demand_aux_staging
      work_pool: *my_work_pool
    - name: Stage Cadip
      tags: ["cadip", "staging"]
      entrypoint: ./rs_workflows/cadip_flow.py:on_demand_cadip_staging
      work_pool: *my_work_pool
    - name: Stage Prip
      tags: ["prip", "staging"]
      entrypoint: ./rs_workflows/prip_flow.py:on_demand_prip_staging
      work_pool: *my_work_pool
