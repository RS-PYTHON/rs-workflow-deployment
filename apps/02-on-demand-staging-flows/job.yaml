apiVersion: batch/v1
kind: Job
metadata:
  name: prefect-deployment-job-{{ app_name }}
spec:
  template:
    spec:
      containers:
      - name: prefect-deployment-job
        image: prefecthq/prefect:3.6.20-python3.13-kubernetes
        command:
          - bash
          - -c
          - |
            set -e
            echo "📦 Cloning the repository..."
            git clone --single-branch --branch ${RS_CLIENT_LIBRARIES_REF} https://github.com/RS-PYTHON/rs-client-libraries.git
            cd /opt/prefect/rs-client-libraries
            echo "📦 Installing dependencies..."
            ./install.sh

            echo "📦 Prefect deployment..."
            cp /opt/prefect/prefect.yaml .
            uv run prefect --no-prompt deploy --all --prefect-file ./prefect.yaml
        env:
        - name: RS_CLIENT_LIBRARIES_REF
          value: v1.0a9 # v1.0a9
        - name: PREFECT_API_URL
          value: "http://prefect-copernicus-server.processing.svc.cluster.local:4200/api"
        volumeMounts:
        - name: deployment-script
          mountPath: /opt/prefect/prefect.yaml
          subPath: prefect.yaml
      volumes:
      - name: deployment-script
        configMap:
          name: prefect-flow-deploy-config-{{ app_name }}
      restartPolicy: Never
