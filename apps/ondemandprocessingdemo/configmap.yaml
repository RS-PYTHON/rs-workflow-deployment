apiVersion: v1
kind: ConfigMap
metadata:
  name: prefect-flow-deploy-config-ondemandprocessingdemo
data:
  prefect.yaml: |
    prefect-version: 3

    pull:
    - prefect.deployments.steps.git_clone:
        repository: https://github.com/RS-PYTHON/rs-client-libraries.git
        branch: develop # should be 'develop' in git

    definitions:
        work_pools:
            my_work_pool: &my_work_pool
                name: {{ prefect3worker.staging.name }}

    deployments:
    - name: On-demand Cadip staging
      tags: ["on-demand", "staging"]
      entrypoint: ./rs_workflows/on_demand_processing.py:on_demand_cadip_staging
      work_pool: *my_work_pool

    - name: On-demand Auxip staging
      tags: ["on-demand", "staging"]
      entrypoint: ./rs_workflows/on_demand_processing.py:on_demand_auxip_staging
      work_pool: *my_work_pool

    - name: On-demand processing
      tags: ["on-demand", "dpr"]
      entrypoint: ./rs_workflows/on_demand_processing.py:on_demand_processing
      work_pool: *my_work_pool
