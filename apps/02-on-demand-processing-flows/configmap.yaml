apiVersion: v1
kind: ConfigMap
metadata:
  name: prefect-flow-deploy-config-{{ app_name }}
data:
  prefect.yaml: |
    prefect-version: "3"

    pull:
    - prefect.deployments.steps.git_clone:
        repository: https://github.com/RS-PYTHON/rs-client-libraries.git
        branch: v1.0a13

    definitions:
      work_pools:
        my_work_pool: &my_work_pool
          name: {{ prefect3worker.integrated.name }}

    deployments:
    - name: Process Generic
      tags: ["all", "processing"]
      entrypoint: ./rs_workflows/on_demand_processing.py:dpr_processing
      work_pool: *my_work_pool
    - name: Process L0
      tags: ["l0", "processing", "s1", "s2", "s3"]
      entrypoint: ./rs_workflows/on_demand/common/l0.py:process_l0
      work_pool: *my_work_pool
    - name: Process S1 L0
      tags: ["l0", "processing", "s1"]
      entrypoint: ./rs_workflows/on_demand/sentinel1/s1_l0.py:process_s1l0
      work_pool: *my_work_pool
    - name: Process S3 L0
      tags: ["l0", "processing", "s3"]
      entrypoint: ./rs_workflows/on_demand/sentinel3/s3_l0.py:process_s3l0
      work_pool: *my_work_pool
    - name: Process S3 L1 OLCI
      tags: ["l1", "processing", "s3", "olci"]
      entrypoint: ./rs_workflows/on_demand/sentinel3/s3_l1_olci.py:process_s3l1_olci
      work_pool: *my_work_pool
