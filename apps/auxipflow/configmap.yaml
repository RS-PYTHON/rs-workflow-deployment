apiVersion: v1
kind: ConfigMap
metadata:
  name: prefect-flow-deploy-config-{{ app_name }}
data:
  prefect.yaml: |
    prefect-version: "3"

    pull:
    - prefect.deployments.steps.git_clone:
        repository: https://github.com/RS-PYTHON/rs-client-libraries.git
        branch: v1.0a7

    definitions:
      work_pools:
        my_work_pool: &my_work_pool
          name: {{ prefect3worker.staging.name }}

    deployments:
    - name: Auxip search
      tags: ["on-demand", "staging"]
      entrypoint: ./rs_workflows/auxip_flow.py:search
      work_pool: *my_work_pool
