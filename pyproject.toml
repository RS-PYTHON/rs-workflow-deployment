[project]
name = "rs-workflow-deployment"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# For the pytests of the python code included in the apps (see tests/)
dev = [
    "jinja2",
    "pytest",
    "pytest-cov",
    "pyyaml",
]

[tool.setuptools]
packages = [] # nothing to package, the project is only installed for the pytests

[tool.bandit]
exclude_dirs = ["tests"]
